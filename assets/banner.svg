<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080b14" />
      <stop offset="50%" stop-color="#0d1527" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <!-- Glowing filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 40px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 19px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }
    .tagline-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #38bdf8;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    /* Ambient animated background orbs */
    @keyframes pulseOrb1 {
      0%, 100% { transform: translate(0px, 0px) scale(1); opacity: 0.25; }
      50% { transform: translate(30px, -20px) scale(1.15); opacity: 0.45; }
    }
    @keyframes pulseOrb2 {
      0%, 100% { transform: translate(0px, 0px) scale(1); opacity: 0.2; }
      50% { transform: translate(-40px, 25px) scale(1.2); opacity: 0.38; }
    }
    @keyframes scanLine {
      0% { transform: translateY(0px); opacity: 0; }
      20% { opacity: 0.85; }
      80% { opacity: 0.85; }
      100% { transform: translateY(110px); opacity: 0; }
    }
    @keyframes flowNodes {
      0% { stroke-dashoffset: 60; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes floatPill {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }

    .orb-1 { animation: pulseOrb1 9s ease-in-out infinite; transform-origin: 200px 100px; }
    .orb-2 { animation: pulseOrb2 11s ease-in-out infinite; transform-origin: 1000px 300px; }
    .scanner { animation: scanLine 3.5s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    .flowing-path { stroke-dasharray: 6 6; animation: flowNodes 2s linear infinite; }
    .pill-1 { animation: floatPill 4s ease-in-out infinite; }
    .pill-2 { animation: floatPill 4.5s ease-in-out infinite 0.5s; }
    .pill-3 { animation: floatPill 5s ease-in-out infinite 1s; }
    .pill-4 { animation: floatPill 4.2s ease-in-out infinite 1.5s; }
    .pill-5 { animation: floatPill 4.8s ease-in-out infinite 2s; }
  </style>

  <!-- Background Canvas -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGradient)" />

  <!-- Subtle Blueprint / Grid Lines in background -->
  <g opacity="0.07" stroke="#38bdf8" stroke-width="1">
    <path d="M 0,70 L 1200,70 M 0,140 L 1200,140 M 0,210 L 1200,210 M 0,280 L 1200,280 M 0,350 L 1200,350" />
    <path d="M 150,0 L 150,420 M 300,0 L 300,420 M 450,0 L 450,420 M 600,0 L 600,420 M 750,0 L 750,420 M 900,0 L 900,420 M 1050,0 L 1050,420" />
  </g>

  <!-- Dynamic Animated Ambient Orbs (Z-Index: Background) -->
  <g>
    <circle class="orb-1" cx="180" cy="90" r="160" fill="#38bdf8" filter="url(#glow)" />
    <circle class="orb-2" cx="1020" cy="320" r="180" fill="#818cf8" filter="url(#glow)" />
    <circle cx="600" cy="210" r="120" fill="#c084fc" opacity="0.12" filter="url(#glow)" />
  </g>

  <!-- Dynamic Technical Graphic: Document Parsing Pipeline (Right Background / Flank) -->
  <g transform="translate(870, 75)" opacity="0.85">
    <!-- Doc Card -->
    <rect x="0" y="0" width="180" height="120" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    <line x1="25" y1="30" x2="100" y2="30" stroke="#64748b" stroke-width="4" stroke-linecap="round" />
    <line x1="25" y1="50" x2="155" y2="50" stroke="#475569" stroke-width="3" stroke-linecap="round" />
    <line x1="25" y1="70" x2="140" y2="70" stroke="#475569" stroke-width="3" stroke-linecap="round" />
    <line x1="25" y1="90" x2="110" y2="90" stroke="#475569" stroke-width="3" stroke-linecap="round" />
    <!-- Dynamic Scanner Laser -->
    <line class="scanner" x1="10" y1="10" x2="170" y2="10" stroke="#38bdf8" stroke-width="2.5" filter="url(#softGlow)" />

    <!-- Connecting Flow Path to Markdown/JSON -->
    <path class="flowing-path" d="M 90,120 L 90,165" fill="none" stroke="#818cf8" stroke-width="2" />

    <!-- Extracted Markdown & RAG Output Card -->
    <rect x="0" y="165" width="180" height="80" rx="10" fill="url(#cardGrad)" stroke="#6366f1" stroke-width="1.5" />
    <text x="20" y="195" font-family="monospace" font-size="12" fill="#38bdf8"># Structured Data</text>
    <text x="20" y="215" font-family="monospace" font-size="11" fill="#34d399">{ &quot;tables&quot;: 4, &quot;rag&quot;: true }</text>
    <text x="20" y="232" font-family="monospace" font-size="11" fill="#a78bfa">-- Markdown Ready --</text>
  </g>

  <!-- Header Category Pill / Tagline (Foreground) -->
  <g transform="translate(70, 58)">
    <rect x="0" y="0" width="345" height="30" rx="15" fill="#0369a1" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1" />
    <circle cx="16" cy="15" r="5" fill="#38bdf8" filter="url(#softGlow)" />
    <text class="tagline-text" x="32" y="20">CURATED ECOSYSTEM &amp; BENCHMARKS</text>
  </g>

  <!-- Main Title (Strictly Foreground & Readable) -->
  <text class="title-text" x="70" y="132">
    Document Intelligence &amp; PDF Parsing OCR
  </text>

  <!-- Accent Underline -->
  <rect x="70" y="150" width="460" height="4" rx="2" fill="url(#accentGrad)" />

  <!-- Subtitle (Clear, crisp foreground) -->
  <text class="subtitle-text" x="70" y="194">
    The Definitive Guide to Layout-Aware PDF Parsers, Enterprise IDP, Multilingual OCR &amp; RAG Pipelines
  </text>
  <text class="subtitle-text" x="70" y="224" fill="#cbd5e1" font-size="16px">
    Comparative Pricing, Financial Valuations, Enterprise Free Tiers &amp; Ranked Open-Source Repositories
  </text>

  <!-- Dynamic Feature Badges / Interactive Pills (Floating softly, not overlapping text) -->
  <g transform="translate(70, 275)">
    <!-- Pill 1: Layout Analysis -->
    <g class="pill-1" transform="translate(0, 0)">
      <rect x="0" y="0" width="142" height="38" rx="19" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1" />
      <text class="badge-text" x="71" y="24" text-anchor="middle">📄 Layout Analysis</text>
    </g>

    <!-- Pill 2: Multilingual OCR -->
    <g class="pill-2" transform="translate(154, 0)">
      <rect x="0" y="0" width="145" height="38" rx="19" fill="url(#cardGrad)" stroke="#818cf8" stroke-width="1" />
      <text class="badge-text" x="72" y="24" text-anchor="middle">👁️ Neural OCR</text>
    </g>

    <!-- Pill 3: VLM & Docling -->
    <g class="pill-3" transform="translate(311, 0)">
      <rect x="0" y="0" width="160" height="38" rx="19" fill="url(#cardGrad)" stroke="#c084fc" stroke-width="1" />
      <text class="badge-text" x="80" y="24" text-anchor="middle">🤖 Vision LLM Parsers</text>
    </g>

    <!-- Pill 4: Table Extraction -->
    <g class="pill-4" transform="translate(483, 0)">
      <rect x="0" y="0" width="148" height="38" rx="19" fill="url(#cardGrad)" stroke="#34d399" stroke-width="1" />
      <text class="badge-text" x="74" y="24" text-anchor="middle">📊 Table &amp; Forms</text>
    </g>

    <!-- Pill 5: LLM RAG Ready -->
    <g class="pill-5" transform="translate(643, 0)">
      <rect x="0" y="0" width="145" height="38" rx="19" fill="url(#cardGrad)" stroke="#f43f5e" stroke-width="1" />
      <text class="badge-text" x="72" y="24" text-anchor="middle">⚡ LLM RAG Ready</text>
    </g>
  </g>

  <!-- Border Frame -->
  <rect x="1" y="1" width="1198" height="418" rx="15" fill="none" stroke="#334155" stroke-width="1.5" />
</svg>
